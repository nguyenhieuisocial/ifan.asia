<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
    a { color: oklch(0.58 0.17 40); } a:hover { color: oklch(0.54 0.17 40); }
  </style>
</helmet>

<div style="width: 420px; background: oklch(1 0 0); color: oklch(0.216 0.006 56); font-family: 'Be Vietnam Pro', system-ui, sans-serif">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid oklch(0.923 0.004 55)">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 16px; font-weight: 600">Hôm nay gọi ai</div>
      <div style="font-size: 12px; color: oklch(0.553 0.013 58)">Việc cần làm ngày 21/08</div>
    </div>
    <div style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: oklch(0.95 0.04 150); color: oklch(0.4 0.09 150); font-size: 11px; font-weight: 500">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Đã xong hôm nay 5
    </div>
  </div>

  <div style="display: flex; gap: 4px; padding: 10px 16px 0">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 8px; background: oklch(0.58 0.17 40); color: #fff; font-size: 13px; font-weight: 500">Của tôi</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 8px; font-size: 13px; color: oklch(0.553 0.013 58)">Cả tiệm</div>
  </div>

  <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.577 0.245 27.325)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <div style="font-size: 14px; font-weight: 600">Việc quá hạn</div>
        <div style="display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; background: oklch(0.95 0.05 75); color: oklch(0.4 0.09 75); font-size: 11px; font-weight: 600">3</div>
      </div>

      <sc-for list="{{quaHan}}" as="k" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid oklch(0.923 0.004 55); border-radius: 8px">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="font-size: 14px; font-weight: 500">{{k.ten}}</div>
            <div style="font-size: 11px; color: oklch(0.553 0.013 58)">{{k.vi}}</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: none">
            <div style="font-size: 12px; color: oklch(0.553 0.013 58)">{{k.sdt}}</div>
            <div style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid oklch(0.923 0.004 55); font-size: 12px; font-weight: 500">Đánh dấu xong</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        <div style="font-size: 14px; font-weight: 600">Việc hôm nay</div>
        <div style="display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; background: oklch(0.968 0.004 60); color: oklch(0.553 0.013 58); font-size: 11px; font-weight: 600">2</div>
      </div>
      <div style="padding: 14px 12px; border: 1px dashed oklch(0.923 0.004 55); border-radius: 8px; text-align: center; font-size: 12px; color: oklch(0.553 0.013 58)">
        Hôm nay không còn việc nào đến hạn.
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.577 0.245 27.325)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5Z"/></svg>
        <div style="font-size: 14px; font-weight: 600">Khách nóng chưa có việc nào</div>
        <div style="display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; background: oklch(0.95 0.05 75); color: oklch(0.4 0.09 75); font-size: 11px; font-weight: 600">4</div>
      </div>
      <sc-for list="{{khachNong}}" as="k" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid oklch(0.923 0.004 55); border-radius: 8px">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="display: flex; align-items: center; gap: 6px">
              <div style="font-size: 14px; font-weight: 500">{{k.ten}}</div>
              <div style="display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 999px; background: oklch(0.95 0.05 90); color: oklch(0.4 0.06 70); font-size: 10px; font-weight: 600">{{k.diem}}</div>
            </div>
            <div style="font-size: 11px; color: oklch(0.553 0.013 58)">{{k.vi}}</div>
          </div>
          <div style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid oklch(0.923 0.004 55); font-size: 12px; font-weight: 500; flex: none">Mở hồ sơ</div>
        </div>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      quaHan: [
        { ten: "Chị Mai Anh", vi: "Quá hạn từ 09:30 · Gọi lại chốt gói 10 buổi", sdt: "0909 121 314" },
        { ten: "Anh Tuấn", vi: "Quá hạn từ hôm qua · Cơ hội: Nâng gói VIP", sdt: "0912 445 668" },
      ],
      khachNong: [
        { ten: "Chị Ngọc Hà", diem: "86", vi: "Tương tác gần nhất: 4 ngày trước" },
        { ten: "Chị Thu Hiền", diem: "78", vi: "Chưa có tương tác" },
      ],
    };
  }
}
</script>
</body>
</html>
