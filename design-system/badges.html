<!doctype html><meta charset="utf-8"><title>Huy hiệu & dải điểm</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Be Vietnam Pro',ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif;background:#fff;color:#1c1917;padding:24px}
.serif{font-family:Lora,Georgia,'Times New Roman',serif}
h1{font-size:15px;font-weight:600;margin-bottom:14px;color:#78716c;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:#a8a29e;margin-top:12px}
</style><body>
<h1>Huy hiệu trung thực</h1>
<div class="row">
<span style="background:#dcfce7;color:#15803d;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600">Sẵn sàng</span>
<span style="background:#fef3c7;color:#b45309;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600">Sắp có</span>
</div>
<h1 style="margin-top:18px">Dải điểm khách (lead score 0–100)</h1>
<div class="row">
<span style="background:#fee2e2;color:#dc2626;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700">🔥 Nóng ≥70</span>
<span style="background:#fef3c7;color:#b45309;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700">Ấm 40–69</span>
<span style="background:#f1f5f9;color:#64748b;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700">Lạnh &lt;40</span>
</div>
<h1 style="margin-top:18px">Phân hạng khách</h1>
<div class="row">
<span style="background:#e0f2fe;color:#0369a1;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600">VIP</span>
<span style="background:#dcfce7;color:#15803d;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600">Quen</span>
<span style="background:#f5f5f4;color:#57534e;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600">Mới</span>
<span style="background:#f1f5f9;color:#94a3b8;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600">Ngủ đông</span>
</div></body>
