name: CI
on:
  push:
    branches: [main]
  pull_request:

# Lỗ thật bắt được 14/08: nhiều lượt push sát nhau (kể cả force-push sửa
# thông điệp commit, không đổi code) khiến 2 job CI chạy CHỒNG THỜI GIAN,
# cùng ghi vào MỘT hàng cấu hình dùng chung (`platform_bot_chat_id`) trên
# CSDL thật — khoá lẫn nhau tới khi Postgres huỷ vì "statement timeout".
# Huỷ job cũ khi có push mới trên cùng nhánh thì hết đụng độ.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Cổng dòng `Founder:` — đứng TRƯỚC `npm ci` để đỏ trong ~10 giây, vì nó
      # chỉ cần `node`, không cần thư viện.
      #
      # ⚠️ Đây là lớp BÁO ĐỘNG, không phải chốt chặn. Vercel dựng bản độc lập
      # với CI: commit sai đã push thì bản tin vẫn phát, dù CI đỏ. Chốt chặn
      # thật gồm hai lớp khác: hook `commit-msg` (chặn lúc viết) và lưới đỡ
      # trong `tg_release_mark` (loại câu xấu lúc soạn tin). Lớp này tồn tại để
      # commit sai KHÔNG lọt qua trong im lặng khi ai đó chưa cài hook.
      - name: Dòng Founder trong commit — có dấu, đúng chỗ, không chép lời chỉ đạo
        run: |
          node scripts/soat-commit-founder.mjs --test
          node scripts/soat-commit-founder.mjs --head
      - run: npm ci
      # Cổng bảo mật thư viện — đứng ngay sau `npm ci` (không cần build/DB).
      # audit-level=high: chặn khi có lỗ MỨC CAO trở lên (dính đúng nanoid
      # 14/08, task rà soát "còn sót gì" của founder). Founder 14/08 duyệt
      # bật kèm Dependabot (repo-level, không nằm trong file này) — hai lớp
      # bổ sung nhau: đây bắt lúc có PUSH, Dependabot bắt lúc KHÔNG ai push.
      - name: Soi lỗ bảo mật thư viện (mức CAO trở lên phải chặn)
        run: npm audit --omit=dev --audit-level=high
      # Cổng Next.js 16 Turbopack: "use server" chỉ được export async function.
      # Export hằng số trong "use server" làm TOÀN BỘ file mất export — Turbopack
      # báo lỗi ở chỗ KHÁC (hàm không tìm thấy), rất khó trace. Bắt được tận gốc
      # 19/08 sau 3 build Vercel liên tiếp thất bại (purchases + sla actions.ts).
      - name: Cổng use-server — chỉ export async function
        run: node scripts/soat-use-server-exports.mjs
      # Đọc vai của người đang đăng nhập phải qua `getCurrentMembership`.
      # Lỗ THẬT đo trên dữ liệu production 19/08: 5 chỗ tự viết
      # `.from("tenant_members").select("role").maybeSingle()` — không lọc
      # user_id, mà RLS cho một thành viên thấy MỌI thành viên cùng tiệm. Tiệm
      # 1 người thì chạy đúng (nên bug ngủ yên); tiệm từ 2 người trở lên thì
      # maybeSingle() trả lỗi và màn hình chặn nhầm CẢ CHỦ TIỆM. Lúc phát hiện
      # đã có một tiệm 3 người ⇒ Két sắt · Hợp đồng · 3 nút Xuất Excel đang hỏng.
      - name: Doc vai — phai loc dung nguoi dang dang nhap
        run: node scripts/soat-doc-vai.mjs
      # Lối vào của từng mảng trên ĐIỆN THOẠI. Đo 19/08: kho có 31 mảng khai
      # "chạy thật" nhưng thanh dưới chỉ 4 ô đóng cứng ⇒ 25/31 mảng chỉ tới được
      # qua MỘT nút ảnh đại diện 44×36px. Khung 4 ô ấy dựng lúc kho còn ~8 mảng
      # và không lần nào được xét lại qua 6 đợt tính năng. Không cổng nào bắt
      # được, vì về mặt kỹ thuật mọi thứ vẫn "dựng xong": migration chạy, RLS
      # đúng, build xanh. Cái hỏng nằm ở chỗ chưa ai đo — khoảng cách từ ngón
      # tay tới màn hình. Mảng không có lối vào thì bằng chưa làm, mà nó vẫn
      # được đếm là "ready" trên trang bán hàng.
      # Chỉ đọc mã nguồn (không cần CSDL, không cần thư viện) nên đỏ trong ~1 giây.
      - name: Loi vao tung mang — khong mang nao bi chon khoi dien thoai
        run: node scripts/soat-loi-vao-mang.mjs
      - run: npm run lint
      # Cấu hình công khai đọc từ env (lib/config.ts) — KHÔNG còn giá trị dự phòng.
      # Secret chưa cài sẽ ra chuỗi rỗng → build GÃY NGAY kèm tên biến còn thiếu.
      # Đó là chủ đích: thà đỏ CI còn hơn âm thầm deploy nối vào nhầm dự án Supabase.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build
      # Cổng kiểm kiểu chữ đứng SAU build: hai file kiểu do Next sinh
      # (next-env.d.ts + .next/types) chỉ tồn tại sau build/typegen — chạy trước
      # là gãy oan vì thiếu file sinh, không phải vì code sai (đã dính 10/08).
      - name: Typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run typecheck
      - name: RLS isolation gate — DB thật, transaction rollback sạch
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/rls-smoke.mjs
      - name: Chốt chặn spam — bộ đếm phải THẬT chặn, không tự mở toang
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/rate-limit-smoke.mjs
      # Hai chỗ mất tiền nhanh nhất của sản phẩm: mã giảm giá và sổ điểm.
      # Ba trần voucher phải là ràng buộc CSDL (không phải lời nhắc trên màn
      # hình), mã phải phân bổ về từng dòng đúng tới từng đồng, và sổ điểm phải
      # append-only. Bộ này đã bắt được một lỗi thật ngay hôm viết: hàm tích điểm
      # trừ voucher lần thứ hai ⇒ khách mất điểm oan (migration #157-159).
      - name: Voucher va so diem — ba trần có thật, phân bổ khớp từng đồng
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/voucher-diem-smoke.mjs
      # Webhook ra ngoài + khoá API. Bộ này bắt được BA lỗi thật ngay lượt chạy
      # đầu tiên, trước khi có tiệm nào dùng: sai kiểu khoá làm cả mảng phát tin
      # chết câm · ràng buộc "phải có loại sự kiện" không chặn được gì (bẫy NULL
      # của array_length) · nhận lại phiếu đang gửi dở làm bên nhận nhận hai lần.
      # Kèm chốt chặn SSRF — địa chỉ webhook do người dùng nhập là cửa bắt máy
      # chủ tự đi lấy thông tin đăng nhập hạ tầng (cùng lớp rủi ro với #36).
      - name: Webhook va khoa API — phat tin dung, chan duoc dia chi noi bo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node --experimental-strip-types scripts/webhook-apikey-smoke.mjs
      # Điều kiện của quy trình tự động — hàm THUẦN, quyết định một luật có chạy
      # hay không. Sai một nhánh thì hoặc luật im lặng không chạy (chủ tiệm tưởng
      # đã bật), hoặc chạy với MỌI sự kiện (luật gõ sai thành luật càn quét).
      # Cả hai đều không có gì báo. Kiểm cả TƯƠNG THÍCH NGƯỢC: playbook cài sẵn
      # đang chạy thật không được lệch một ly sau khi thêm phép so (#163).
      - name: Dieu kien quy trinh — phep so moi dung, cach viet cu khong doi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/dieu-kien-smoke.mjs
      # Trần giảm giá theo vai. Chỗ mất tiền TRỰC TIẾP: một lỗ ở đây nghĩa là
      # nhân viên tự giảm bao nhiêu cũng được, không ai biết tới cuối tháng.
      # Bộ này đóng ba đường lách: tự duyệt phiếu mình · nhờ người trần thấp hơn
      # gật hộ · ghi thẳng vào bảng để bỏ qua hàm (migration #165).
      - name: Tran giam gia — ba duong lach deu dong
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/tran-giam-gia-smoke.mjs
      # Nhân sự · Chấm công · Bảng lương (migration #166-167, #172-173).
      # Ba thứ sai ở đây là hỏng nặng và không có gì báo: LƯƠNG LỘ (thẻ design
      # cấm quản lý xem lương người khác — ngoại lệ so với cả kho) · CHỐT RỒI VẪN
      # SỬA ĐƯỢC (khoá bảng tổng mà quên khoá từng lần chấm) · CỜ CHẤM CÔNG DO
      # CLIENT GỬI. Bộ này bắt được HAI lỗi thật ngay hôm viết: một hàm trigger
      # dùng cho hai bảng khác cột (cả mảng lương chết ngay thao tác đầu), và
      # ràng buộc tự chặn đường mở khoá (chốt nhầm là khoá vĩnh viễn).
      - name: Nhan su va bang luong — chot roi khoa, luong khong lo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/nhan-su-luong-smoke.mjs
      # BA BỘ KIỂM NÀY ĐÃ VIẾT XONG TỪ 19/08 NHƯNG KHÔNG AI GỌI — phát hiện khi
      # soát lại chính bài mình vừa làm. Một bộ kiểm không được gọi thì đúng
      # bằng không có: nó vẫn xanh trên máy người viết, rồi mục mà nó canh cứ
      # thế đổi cho tới lúc nó sai mà không ai biết. Ghi lại vì đây là kiểu
      # "hỏng im lặng" thứ ba trong một ngày, cùng họ với hai cái trước.
      - name: Man Nhan su & Bang luong — lenh cua man dung, phieu quy khong lo luong ai
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/man-nhan-su-luong-smoke.mjs
      # Hoa hồng đẻ ra TIỀN, và tiền đó chảy thẳng vào phiếu lương. Bộ này khoá
      # ba chỗ chết người: một đơn chỉ sinh hoa hồng ĐÚNG MỘT LẦN (chốt lại lần
      # hai không cộng thêm), đơn trả hàng thì trừ ngược, và không tiệm nào đọc
      # được khoản của tiệm khác.
      - name: Hoa hong — mot don mot lan, tra hang tru nguoc, khong lan tiem
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/hoa-hong-smoke.mjs
      - name: Tong ket chien dich — so khop nguon, nhan vien khong tu goi duoc
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/tong-ket-chien-dich-smoke.mjs
      # Cắt ghép nối bot khi gỡ người khỏi tiệm (migration #212). Đường bot KHÔNG
      # đi qua thẻ đăng nhập nên không có gì tự hết hạn: người đã nghỉ vẫn nhận
      # bản tin kinh doanh VÔ THỜI HẠN. Chốt là TRIGGER vì việc gỡ người đi thẳng
      # qua policy, không có RPC trung gian nào để nhét lệnh dọn vào.
      # Bộ kiểm này TỪNG VIẾT NGƯỢC (khẳng định "lỗ vẫn còn") nên áp bản vá xong
      # là nó đỏ — đã đảo lại thành "chốt có mặt"; xem chú thích trong file.
      - name: Ghep noi bot — go nguoi khoi tiem thi cat luon duong bot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ghep-noi-bot-smoke.mjs
      # Mã QR gắn nguồn ở FORM MẶT TIỀN (migration #201). Mã QR có hai cửa đi về;
      # cửa hộp chat nối từ #57, cửa form mặt tiền hụt suốt từ 05/08 — mọi khách
      # mới bị gán cứng 'Form/Landing' nên tiệm dán mã ngoài cửa KHÔNG BAO GIỜ
      # biết mã nào mang khách tới. Hỏng im lặng đúng kiểu tệ nhất: báo cáo quy
      # kết nguồn vẫn ra số, chỉ là số sai, và chủ tiệm dùng số ấy để quyết chi
      # tiền quảng cáo. Bộ này canh cả chiều ngược: mã lạ/sai tiệm/đã tắt KHÔNG
      # được ném lỗi — khách đang muốn để lại số, chặn họ vì một tham số hỏng
      # trên URL là đổi lead thật lấy phép kiểm hình thức.
      - name: QR gan nguon o form mat tien — ma dung thi gan, ma hong khong chan khach
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/qr-nguon-mat-tien-smoke.mjs
      # Hàm CSDL KHÔNG được chứa `delete`/`update` thiếu `where`.
      # LỖ THẬT 19/08: một câu `delete from … returning *` không có `where` làm
      # băng-rôn "Bản mới đã lên" CHẾT CÂM ~12 tiếng — Supabase từ chối câu đó
      # ở cửa công khai, hàm vỡ kéo cả giao dịch đổ theo, nên lượt sau vào lại
      # vẫn thấy trạng thái cũ và lại vỡ. Kẹt vĩnh viễn, không gì báo; người
      # phát hiện là founder tự thấy Telegram im. Gõ tay thì nó CHẠY (vai quản
      # trị không bị chốt) nên đọc code và thử tay đều không lộ — chỉ quét toàn
      # bộ mới thấy. Cổng này tìm thêm được cái thứ hai trong 3 phút.
      - name: Ham CSDL — khong co cau xoa/sua thieu dieu kien
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/soat-xoa-khong-dieu-kien.mjs
      # Cửa công khai — hàm nào NGƯỜI CHƯA ĐĂNG NHẬP gọi được.
      # Khoá `anon` nằm công khai trong mã chạy ở trình duyệt, nên "cấp quyền cho
      # anon" đọc đúng là "cho cả thế giới gọi". Ngày 19/08 dính HAI lần cùng một
      # kiểu hại — không lộ dữ liệu, mà làm cho tiếng chuông NÓI DỐI: giữ cho một
      # nhịp đã chết trông như còn sống (#182), và hút sạch hàng đợi bản tin lên
      # bản (#190). Cả hai đều lọt qua đợt rà quyền trước vì lúc đó soát "có rò rỉ
      # không", không ai hỏi "cửa này ai đi được". Cổng này hỏi đúng câu đó.
      # 19/08 thêm LUẬT C — canh nốt lớp `authenticated`. Lớp đó trước KHÔNG ai
      # canh, và 4 lỗ CHÉO TIỆM đã sống ở đó nhiều tuần: người vai thấp nhất của
      # tiệm A đọc được cấu hình điểm của tiệm B, xoá điểm khách của B, triệt tiêu
      # hoa hồng nhân viên của B (#196). Nguyên nhân là lỗi CƠ CHẾ: `revoke … from
      # public, anon` KHÔNG thu quyền của `authenticated` (vai đó được cấp RIÊNG).
      # Nên cổng ĐO quyền thật bằng has_function_privilege, không đọc câu revoke.
      - name: Cua cong khai + lop dang nhap — ai goi duoc thi phai co chot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/soat-cua-cong-khai.mjs
      # Cạnh CHÉO TIỆM: khoá ngoại giữa hai bảng đều có `tenant_id`. Bảng con chỉ
      # kiểm `tenant_id` của CHÍNH DÒNG NÓ, không kiểm bản ghi CHA có cùng tiệm —
      # người tiệm A ghi dòng mang tenant_id = A nhưng trỏ sang bản ghi tiệm B thì
      # RLS thấy khớp nên cho qua. Lớp bệnh này đã phải rà BỐN lần (#131 · #136 ·
      # #204 · #205) và cả ba đợt đầu đều là rà MỘT LẦN RỒI THÔI, không để lại
      # cổng nào canh — nên 10 mảng dựng sau #136 bắt đầu lại từ số không: đo
      # 20/08 ra 26 cạnh hở, nặng nhất là LỘ LƯƠNG nhân viên sang tiệm khác (phiếu
      # lương của tiệm A chiếm chỗ khoá duy nhất (period_id, employee_id) nên lượt
      # chạy bảng lương của tiệm B ghi 5.000.000đ vào dòng tiệm A đọc được).
      # Cổng đọc THÂN HÀM trigger, không đọc TÊN — chính vì thế lượt chạy đầu tiên
      # của nó bắt thêm được cạnh thứ 27 (`deals.lost_reason_id`) mà cả ba đợt rà
      # tay đều bỏ sót, do bảng `deals` đã có trigger cùng tên nên mọi phép đếm
      # theo tên đều tưởng là đã chốt.
      - name: Canh cheo tiem — moi khoa ngoai phai co chot hoac mien tru co bang chung
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/soat-canh-cheo-tiem.mjs
      # INSERT QUÊN KHAI TIỆM — lỗi thiếu dữ liệu ĐỘI LỐT lỗi thiếu quyền.
      # 119 bảng khai `tenant_id not null` không default và KHÔNG bảng nào có
      # trigger điền hộ (đo 20/08). Lệnh ghi quên truyền `tenant_id` thì Postgres
      # từ chối, nhưng KHÔNG lần nào báo 23502 "thiếu cột": bảng thường ra 42501
      # "row-level security" (RLS `with check` xét trước ràng buộc not-null), bảng
      # có trigger chốt chéo tiệm thì ra 23514 kèm câu "nhà cung cấp thuộc tiệm
      # khác". Người dùng đi soát phân quyền hoặc soát dữ liệu tham chiếu, không
      # bao giờ tới chỗ sai thật. Lớp bệnh này đã giết TRỌN từng mảng một: Hợp đồng & Gói định
      # kỳ (0 gói · 0 hợp đồng · 0 buổi trên toàn CSDL) và Két sắt (0/0 dòng, cả
      # hai nút ghi đều chết) — cả hai vá 20/08.
      # Vì sao phải là cổng: `app/app/contracts/actions.ts` ĐÃ ghi sẵn khối cảnh
      # báo cho đúng lỗi này, mà Két sắt viết CÙNG ĐỢT, file ngay bên cạnh, header
      # lại kết luận ngược ("RLS đủ, tầng này không siết thêm"). Chú thích trong
      # một file không cứu được file bên cạnh.
      - name: Insert quen khai tiem — moi lenh ghi phai tu truyen tenant_id
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/soat-insert-thieu-tenant.mjs
      # BÁO ĐÃ LƯU NHƯNG KHÔNG LƯU ĐƯỢC GÌ — anh em ruột của cổng ngay trên.
      # `.update()` / `.delete()` bị RLS lọc mất dòng thì Supabase trả
      # `error = null` và 0 dòng: IM LẶNG Y HỆT lúc thành công. Đo 20/08 trên
      # CSDL thật, đóng vai người dùng: nhân viên ĐỌC được gói dịch vụ (1 dòng)
      # mà sửa ra 0 dòng không lỗi; vai Chỉ xem đọc được mà xoá ra 0 dòng không
      # lỗi. ĐỐI CHỨNG: cùng câu ấy vai chủ tiệm ra 1 dòng.
      # Lượt chạy đầu bắt 50 chỗ, trong đó nặng nhất là những chỗ KHÔNG có cổng
      # vai nào ở tầng ứng dụng: toạ độ chấm công của tiệm · nhãn khách · đếm
      # hàng kiểm kê · chốt phiếu nhập (bước VÀO KHO — hụt là hàng không vào kho
      # mà màn vẫn báo đã lưu) · tổng phiếu lương.
      # Vì sao phải là CỔNG chứ không phải một đợt rà: kho này đã học đúng bài
      # này rồi mà vẫn tái phát — đợt rà cạnh chéo tiệm #136 làm một lần rồi
      # thôi, không để lại cổng nào canh, nên 10 mảng dựng sau nó bắt đầu lại từ
      # số không. Khuôn vá chuẩn nằm sẵn ở `app/app/contracts/actions.ts` mà 50
      # chỗ khác không theo.
      # Chỉ đọc mã nguồn (không cần CSDL, không cần thư viện) nên đỏ trong ~1 giây.
      - name: Bao da luu ma khong luu — moi lenh sua/xoa phai dem so dong
        run: node scripts/soat-ghi-im-lang.mjs
      # Đồng hồ canh im lặng (migration #178-179).
      # Ngày 19/08 có HAI thứ hỏng suốt ~12 tiếng mà không gì báo, người phát
      # hiện là founder chứ không phải máy. Đồng hồ này sinh ra để chuyện đó
      # không lặp lại — nên chính nó mà hỏng im lặng thì tệ hơn không có.
      # Bốn thứ được canh: im thì KÊU · sống lại thì TỰ TẮT chuông · nhịp CHƯA
      # BAO GIỜ chạy bị coi là đáng ngờ nhất · gõ sai tên nhịp không đẻ ra "nhịp
      # ma" (nhịp không ai canh mà cũng không ai biết là nó tồn tại).
      # Kỷ luật của chính các bộ kiểm — đứng TRƯỚC mọi bộ kiểm đụng CSDL, vì nó
      # chỉ đọc mã nguồn nên đỏ trong ~1 giây nếu ai đó quên.
      # Cổng kiểm chạy trên ĐÚNG kho dữ liệu của khách thật (chỗ yếu đã biết,
      # xem việc theo dõi "tách kho cho việc kiểm"). Chừng nào chưa tách được,
      # hai luật này giữ cho việc dùng chung không gây hại: mọi bộ đụng CSDL
      # phải đặt hạn chờ khoá, và bộ nào mở giao dịch phải đóng bằng rollback.
      # Ngày 19/08 đã phải chờ-thử-lại 10 lượt khi áp bản vá vì thiếu luật 1.
      - name: Ky luat bo kiem — co han cho khoa, dong bang rollback
        run: node scripts/soat-ky-luat-bo-kiem.mjs
      - name: Dong ho canh im lang — im thi keu, song lai thi tu tat
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/dong-ho-im-lang-smoke.mjs
      # Thẻ thiết kế không được nói sai về code đang chạy.
      # Bắt được 19/08: 3 thẻ (Kho · Kiểm kê · Phiếu nhập) vẫn tự khai "CHƯA CÓ
      # CODE" trong khi cả ba màn đã chạy thật nhiều ngày — ai đọc thẻ để làm
      # tiếp sẽ đi dựng lại thứ đã có. Cổng này chỉ canh được bản ở MÁY; bản trên
      # Claude Design vẫn phải đẩy tay (cần đăng nhập, CI không làm được).
      - name: The thiet ke — khong khai sai ve code dang chay
        run: node scripts/soat-the-design.mjs
      # Thẻ thiết kế có CHỮ NÀO BỊ CẮT MẤT ở khổ điện thoại không.
      # Ba thẻ vẽ 20/08: nhánh vẽ đo xong báo "cả ba đã 375/375, không trôi
      # ngang", nhánh soát lại báo "vẫn tràn". Đo lại kỹ thì CẢ HAI phép đo đều
      # trả lời sai câu cần hỏi — chi tiết trong đầu file bộ kiểm. Ngắn gọn:
      # "trang không trôi ngang" ra số đẹp vì khung mô phỏng đang overflow:hidden
      # (giấu, không phải vừa); còn "có tổ tiên overflow:hidden ⇒ bị cắt" thì báo
      # oan hàng trăm chỗ, vì một hộp hidden chỉ cắt phần nằm NGOÀI chính nó.
      # Cổng này hỏi đúng câu người dùng quan tâm: CÓ CHỮ NÀO KHÔNG VỚI TỚI ĐƯỢC
      # KHÔNG — gồm cả loại mà hai phép trên đều mù: hộp `nowrap` + `hidden` tự
      # cắt chữ của chính nó dù nằm gọn trong khung (bắt được 3 thẻ kiểu này).
      #
      # ⚠️ `playwright` CỐ Ý không nằm trong package.json: nó chỉ phục vụ việc
      # soát thẻ, web chạy không cần tới, thêm vào là bắt mọi lượt `npm ci` của
      # mọi người phải tải trình duyệt. Nên cài tại chỗ, GHIM ĐÚNG PHIÊN BẢN.
      # Thiếu thư viện thì bộ kiểm ĐỎ chứ không tự bỏ qua (cổng tự bỏ qua khi
      # thiếu đồ nghề thì không phân biệt được với cổng luôn xanh — đúng con
      # bệnh `check-ds.mjs`, một cái tên ma mà 111 thẻ đã vẽ ở dưới).
      #
      # ⚠️ CHỖ CHƯA CHỨNG MINH ĐƯỢC, nói thẳng: bước này chưa từng chạy trên máy
      # CI thật (không dựng được GitHub Actions từ máy founder để thử). Hai rủi
      # ro đã biết: (1) `playwright install --with-deps` cần tải ~130MB mỗi lượt,
      # làm CI chậm thêm khoảng một phút; (2) bề rộng chữ đổi theo PHÔNG, mà máy
      # CI là Linux không có Segoe UI. Đã ĐO rủi ro (2): ép cả bộ thẻ sang phông
      # rộng hơn hẳn thì 14/148 thẻ đổi số đếm, và 2 thẻ đang sạch thì hỏng thêm.
      # Vì thế bộ kiểm so theo trạng thái CÓ/KHÔNG chứ không so số đếm. Rủi ro
      # còn lại: một thẻ sát mép có thể đỏ ở đây mà xanh trên máy founder. Nếu
      # chuyện đó xảy ra thì ĐỪNG tắt bước này — khai thẻ đó vào `NO_CU` kèm
      # ghi chú, hoặc nới khuôn thẻ cho bớt sát mép.
      - name: The thiet ke — khong chu nao bi cat cut o kho dien thoai
        run: |
          npm i --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/soat-the-tren-dien-thoai.mjs
      # Trang CÔNG KHAI không được trôi ngang trên điện thoại. Đo 20/08 trên bản
      # đang phục vụ: 5/5 trang tiếp thị đều trôi — trang chủ, bảng giá, tính
      # năng, lộ trình, trang ngành — ở cả 375px lẫn 320px. Thủ phạm chung là một
      # hàng 6 mục ở chân trang dùng chung.
      #
      # Đây là lần thứ HAI cùng lớp bệnh: việc #39 đã sửa một thủ phạm KHÁC (khối
      # banner đầu trang) rồi thôi, không để lại cổng nào canh — nên thủ phạm thứ
      # hai nằm im tới hôm nay, trên đúng những trang khách nhìn TRƯỚC KHI quyết
      # định có dùng iFan không.
      #
      # Đo trên bản VỪA BUILD ở đây, KHÔNG đo bản đang phục vụ: CI chạy TRƯỚC khi
      # Vercel dựng bản mới, nên đo bản đang phục vụ là đo mã CŨ — cổng sẽ luôn
      # nói về một bản khác với bản đang xét, tức vô nghĩa.
      - name: Trang cong khai — khong troi ngang tren dien thoai
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run start &
          # Chờ bằng vòng lặp curl thay vì thêm một thư viện chỉ để chờ.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/ || { echo "❌ Máy chủ không lên sau 120s"; exit 1; }
          DIA_CHI=http://localhost:3000 node scripts/soat-trang-cong-khai-dien-thoai.mjs
      # Trang cảnh báo chuyển hướng của /q/<mã> (#215). Dùng CHUNG máy chủ vừa
      # dựng ở bước trên — không tốn thêm lượt build. Cái dễ hỏng nhất không
      # phải hai ngã cảnh báo mà là NGÃ ĐI THẲNG: nới tay một chút là cửa
      # chuyển hướng mở lại, và không có gì kêu.
      - name: Trang canh bao chuyen huong — dung ba nga
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DIA_CHI: http://localhost:3000
        run: node scripts/qr-canh-bao-smoke.mjs
      # Thẻ sửa ở git mà QUÊN đẩy lên Claude Design.
      # Cổng kiểm không hỏi thẳng Claude Design được: đường đẩy đi qua phiên
      # đăng nhập claude.ai của founder — phiên đó có thật và đủ quyền, nhưng
      # nằm ở máy founder, không nằm trên máy chạy CI này. Nên canh gián tiếp:
      # mỗi lần đẩy xong ghi dấu vân tay bộ thẻ vào `design-system/.dong-bo.json`
      # (có trong git), cổng so dấu vân tay hiện tại với sổ đó.
      # Bắt đúng con bệnh đã xảy ra thật 19/08: 4 thẻ mới nhất chưa hề lên và
      # 3 thẻ nói sai về code đang chạy — suốt nhiều ngày không gì báo.
      - name: The thiet ke — da day len Claude Design chua
        run: node scripts/soat-dong-bo-the.mjs
      # Sổ migration phải KHỚP thực tế CSDL. Lỗ thật bắt được 17/08: sổ dừng ở
      # #84 (12/08) trong khi kho đã có tới #130 — 44 bản áp thẳng không ghi sổ,
      # suốt 5 ngày không gì báo. Nguy hiểm: `supabase db push` sẽ tưởng 44 bản
      # đó chưa áp và áp lại; bản có `create table`/`insert` thì hỏng hoặc nhân
      # đôi dữ liệu.
      #
      # Bước này đỏ khi: có bản CHƯA ÁP / ÁP MỘT PHẦN (hỏng thật), hoặc bản đã
      # áp mà SỔ CHƯA GHI. Cách sửa in thẳng trong output.
      #
      # Áp migration bằng `node scripts/ap-migration.mjs <version>` thì áp và
      # ghi sổ nằm trong CÙNG một transaction ⇒ không bao giờ lệch lại.
      - name: Sổ migration khớp CSDL — không để lệch trong im lặng
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/ap-migration.mjs --kiem
      # Chỉ MỘT chỗ được khai đợt đang mở (`docs/adr/README.md`, khối 📍).
      # Đo 18/08: BA file cùng khai và CẢ BA đều sai theo ba kiểu khác nhau —
      # nặng nhất là `AGENTS.md` (file mọi phiên MỞ RA ĐẦU TIÊN) ghi "V2 Lịch
      # hẹn" suốt 5 ngày sau khi V2 đóng ⇒ mọi phiên sau khởi động từ bản đồ
      # sai. Không chống bằng "nhớ cập nhật cả ba" (đã hỏng ba lần) mà bằng
      # cách chỉ cho phép một bản. Dòng cố ý nhắc đợt cũ thì dán dấu `đợt-cũ`.
      - name: Chỉ một chỗ khai đợt đang mở — chống chép rồi lệch
        run: node scripts/soat-doi-dang-mo.mjs
      # Bản tin "iFan vừa lên bản mới" — founder đã phản ánh BỐN lần trong 5
      # ngày về cùng một hàm (`tg_release_mark`): chỉ có mã bản · câu commit thô
      # · phát lại nguyên văn lời chỉ đạo · phát cả việc dọn dẹp nội bộ. Bốn lần
      # cùng một chỗ thì phải có bộ kiểm riêng, không kiểm bằng mắt nữa.
      # Gọi hàm THẬT rồi ROLLBACK — pg_net bị khoá (#36) nên không tin nào bay
      # vào nhóm Telegram thật.
      - name: Bản tin lên bản — đúng câu, chặn câu sai khuôn, bỏ bản nội bộ
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/tin-ban-moi-smoke.mjs
      # Không cần CSDL — hàm thuần. Tự chạy lại trên 4 múi giờ, BẮT BUỘC có múi
      # giờ dương: máy chạy CI mặc định UTC, mà lỗi lùi ngày (12/08) chỉ hiện ở
      # múi giờ dương — xanh ở UTC KHÔNG chứng minh được gì cho tiệm Việt Nam.
      - name: Giờ mở cửa mặt tiền — đúng trên mọi múi giờ, không lùi ngày
        run: node --experimental-strip-types scripts/storefront-hours-smoke.mjs
      - name: RLS isolation test qua client SDK (chạy khi có đủ keys)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/test-rls-isolation.mjs
      # Không cần CSDL — bảng quyền lệnh bot Telegram thuần (ADR-0017).
      - name: Quyền lệnh bot Telegram — bảng chặn và bảng /help không được lệch nhau
        run: node --experimental-strip-types scripts/quyen-lenh-smoke.mjs
      # Bước trên so CODE với CODE. Bước này so CODE với TELEGRAM THẬT — khoảng
      # trống tìm ra khi soát bot 17/08: thêm lệnh vào code mà quên chạy
      # `telegram-set-commands.mjs` thì menu ngoài đời thiếu lệnh đó và KHÔNG GÌ
      # BÁO; lệnh không có trong menu thì coi như không tồn tại.
      # Kiểm kèm cả webhook (bot còn nghe được không) — phép kiểm rẻ nhất mà
      # chưa ai làm tự động. Thiếu token thì tự bỏ qua, không làm đỏ CI.
      - name: Menu lệnh bot trên Telegram thật — khớp code, webhook còn sống
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: node scripts/telegram-menu-smoke.mjs
      # Hàm tính giờ trống của màn Lịch — hàm THUẦN, tự chạy lại trên 4 múi giờ.
      # ADR-0009 mục 8 yêu cầu bộ kiểm này ("bộ ca chỉ chạy giờ quốc tế thì xanh
      # giả, trong khi 100% tiệm Việt Nam hỏng"). Nó tồn tại từ 13/08 nhưng
      # KHÔNG được gắn vào đây — bắt được 14/08 khi soát chéo "script kiểm nào
      # có trong kho" với "script kiểm nào CI thật sự chạy". Hệ quả đã xảy ra:
      # lỗi đường dẫn khiến nó chết trên Linux nằm im nhiều ngày, chỉ lộ ra vì
      # tình cờ được vá cùng lượt với storefront-hours (file cùng lỗi, có trong CI).
      - name: Giờ trống màn Lịch — đúng trên mọi múi giờ (ADR-0009 mục 8)
        run: node --experimental-strip-types scripts/booking-schedule-smoke.mjs
