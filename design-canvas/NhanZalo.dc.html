<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
    a { color: oklch(0.58 0.17 40); } a:hover { color: oklch(0.54 0.17 40); }
  </style>
</helmet>

<div style="width: 460px; background: oklch(1 0 0); color: oklch(0.216 0.006 56); font-family: 'Be Vietnam Pro', system-ui, sans-serif; padding: 16px">

  <div style="font-size: 16px; font-weight: 600; margin-bottom: 4px">Một cú bấm — một việc</div>
  <div style="font-size: 12px; color: oklch(0.553 0.013 58); line-height: 1.55; margin-bottom: 18px">
    Ba chỗ dưới đây đang bắt người dùng làm nhiều bước cho một việc. Đổi thành bấm-là-xong.
  </div>

  <sc-for list="{{muc}}" as="m" hint-placeholder-count="3">
    <div style="padding: 14px; border: 1px solid oklch(0.923 0.004 55); border-radius: 8px; margin-bottom: 12px">
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 10px">{{m.ten}}</div>

      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
        <div style="flex: none; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: oklch(0.553 0.013 58); width: 42px">Cũ</div>
        <div style="flex: 1; padding: 8px 10px; border-radius: 6px; background: oklch(0.968 0.004 60); font-size: 12px; color: oklch(0.553 0.013 58)">{{m.cu}}</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: none; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: oklch(0.58 0.17 40); width: 42px">Mới</div>
        <div style="flex: 1; display: flex; align-items: center; gap: 8px">
          <div style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; background: {{m.nen}}; color: {{m.chu}}; font-size: 13px; font-weight: 500">
            {{m.nut}}
          </div>
          <div style="font-size: 11px; color: oklch(0.553 0.013 58); line-height: 1.4">{{m.moi}}</div>
        </div>
      </div>
    </div>
  </sc-for>

  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 8px; background: oklch(0.95 0.05 75); margin-top: 4px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.4 0.09 75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <div style="font-size: 11px; line-height: 1.55; color: oklch(0.4 0.09 75)">
      <b>Nút nhắn Zalo chỉ hiện khi tiệm đã khai đường Zalo.</b> Chưa khai mà vẫn hiện nút thì bấm vào không ra gì — tệ hơn là không có nút.
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      muc: [
        {
          ten: "Số điện thoại khách",
          cu: "Bấm số → chép vào bộ nhớ → mở app gọi → dán → gọi",
          nut: "0909 121 314",
          moi: "Bấm là gọi ngay",
          nen: "oklch(1 0 0)", chu: "oklch(0.216 0.006 56)",
        },
        {
          ten: "Nhắn Zalo cho khách",
          cu: "Chưa có nút nào — phải tự mở Zalo rồi tìm tên khách",
          nut: "Nhắn Zalo",
          moi: "Mở thẳng cửa sổ chat với đúng khách này",
          nen: "oklch(0.96 0.02 40)", chu: "oklch(0.58 0.17 40)",
        },
        {
          ten: "Gửi phiếu lương",
          cu: "Chưa có — chụp màn hình từng người rồi gửi tay",
          nut: "Gửi phiếu lương",
          moi: "Tự vẽ ảnh cho từng người rồi gửi qua Zalo",
          nen: "oklch(0.58 0.17 40)", chu: "#fff",
        },
      ],
    };
  }
}
</script>
</body>
</html>
