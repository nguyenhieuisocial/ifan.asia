<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
    a { color: oklch(0.58 0.17 40); } a:hover { color: oklch(0.54 0.17 40); }
  </style>
</helmet>

<div style="width: 420px; background: oklch(1 0 0); color: oklch(0.216 0.006 56); font-family: 'Be Vietnam Pro', system-ui, sans-serif">

  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid oklch(0.923 0.004 55)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.17L4 17.17V4Z"/></svg>
    <div style="font-size: 16px; font-weight: 600; flex: 1">Cả tiệm</div>
    <div style="font-size: 11px; color: oklch(0.553 0.013 58)">khách KHÔNG thấy</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; min-height: 300px">
    <sc-for list="{{tin}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <div style="flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: oklch(0.96 0.02 40); color: oklch(0.58 0.17 40); font-size: 12px; font-weight: 600">{{t.chu}}</div>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <div style="font-size: 12px; color: oklch(0.553 0.013 58)"><span style="font-weight: 600; color: oklch(0.216 0.006 56)">{{t.ten}}</span> · {{t.gio}}</div>
          <div style="font-size: 14px; line-height: 1.5">{{t.noi}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px; border-top: 1px solid oklch(0.923 0.004 55); display: flex; flex-direction: column; gap: 10px">
    <div style="min-height: 64px; padding: 10px 12px; border: 1px solid oklch(0.923 0.004 55); border-radius: 8px; font-size: 14px; color: oklch(0.553 0.013 58)">Nhắn cho mọi người…</div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
      <div style="font-size: 13px; color: oklch(0.553 0.013 58); margin-right: 2px">@</div>
      <sc-for list="{{nguoi}}" as="n" hint-placeholder-count="4">
        <div style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid oklch(0.923 0.004 55); font-size: 12px">{{n.ten}}</div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="font-size: 11px; color: oklch(0.553 0.013 58); line-height: 1.45; flex: 1">Chỉ khi gọi tên (@) thì người đó mới nhận thông báo.</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 8px; background: oklch(0.58 0.17 40); color: #fff; font-size: 14px; font-weight: 500; flex: none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        Gửi
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tin: [
        { chu: "C", ten: "Chủ tiệm", gio: "10:07", noi: "Chào cả nhà, kênh nhắn nội bộ đã chạy." },
        { chu: "T", ten: "Bạn Thảo (lễ tân)", gio: "10:19", noi: "@Chủ tiệm chị Mai Anh đổi lịch sang chiều mai 15h nhé." },
        { chu: "C", ten: "Chủ tiệm", gio: "10:21", noi: "Ok em, nhớ nhắn lại khách xác nhận giúp chị." },
      ],
      nguoi: [
        { ten: "Bạn Thảo (lễ tân)" }, { ten: "Ngọc Hà" }, { ten: "Thu Hiền" }, { ten: "Lan Anh" },
      ],
    };
  }
}
</script>
</body>
</html>
